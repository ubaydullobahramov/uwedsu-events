<html lang="ru">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>UWED Events</title>

<style>
:root{
  --bg:#eef3fa;--card:rgba(255,255,255,.8);--card-b:rgba(255,255,255,.95);--ink:#0f2340;--mut:#5d6b80;--line:rgba(15,40,80,.10);
  --acc:#003b87;--acc2:#2a64c4;--accs:rgba(0,59,135,.09);--gold:#c9962b;--ok:#15a865;--wait:#c98a00;--no:#d6334a;
  --shadow:0 10px 28px rgba(0,40,100,.10);--field:rgba(255,255,255,.92);--blob1:#2a64c4;--blob2:#7fb0ff;
}
html.dark{
  --bg:#0a0f1a;--card:rgba(24,34,54,.66);--card-b:rgba(255,255,255,.07);--ink:#eef3fb;--mut:#97a3b8;--line:rgba(255,255,255,.08);
  --acc:#4f86e8;--acc2:#7fb0ff;--accs:rgba(79,134,232,.15);--shadow:0 10px 28px rgba(0,0,0,.4);--field:rgba(255,255,255,.06);--blob1:#003b87;--blob2:#1d4f9e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4;transition:background .3s}
body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.b1{width:340px;height:340px;background:var(--blob1);top:-140px;left:-120px;opacity:.22}
.b2{width:300px;height:300px;background:var(--blob2);top:120px;right:-170px;opacity:.16}
.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:14px 14px 0}
.glass{background:var(--card);border:1px solid var(--card-b);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* шапка */
header{display:flex;align-items:center;gap:12px;padding:4px 2px 12px}
.logo{width:48px;height:48px;border-radius:50%;flex:0 0 48px;background:#fff center/cover no-repeat;box-shadow:0 4px 14px rgba(0,59,135,.35);border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;font-weight:900;font-size:11px;color:#fff;overflow:hidden}
.logo.fb{background:linear-gradient(135deg,#003b87,#2a64c4)}
.htxt{flex:1;min-width:0}
header h1{margin:0;font-size:21px;letter-spacing:-.4px;line-height:1.1}
header p{margin:2px 0 0;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--field);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:18px;cursor:pointer;flex:0 0 40px}
.cta{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left;border:1px solid var(--card-b)}
.cta .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--accs);flex:0 0 40px}
.cta b{display:block;font-size:15px}.cta span{font-size:12.5px;color:var(--mut)}
.cta .arr{margin-left:auto;color:var(--mut);font-size:20px}

/* вкладки */
.tabs{display:flex;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--mut);font-weight:700;padding:10px 14px;border-radius:16px;cursor:pointer;white-space:nowrap;flex:1}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 16px rgba(0,59,135,.3)}

/* карточки */
.list{display:flex;flex-direction:column;gap:12px}
.sect{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:6px 4px -2px}
.ev{display:flex;gap:14px;padding:13px;cursor:pointer;transition:transform .12s;text-align:left;width:100%;border:1px solid var(--card-b)}
.ev:active{transform:scale(.985)}
.cover{flex:0 0 84px;width:84px;height:105px;border-radius:16px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(150deg,#003b87,#2a64c4 60%,#7fb0ff);border:1px solid var(--line);color:#fff;font-weight:900;font-size:30px;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.cover img{width:100%;height:100%;object-fit:cover}
.ev .b{flex:1;min-width:0}
.ev h3{margin:0 0 3px;font-size:16px;line-height:1.25}
.club{font-size:12px;font-weight:700;color:var(--acc);margin-bottom:3px}
.meta{color:var(--mut);font-size:13px;display:flex;flex-direction:column;gap:1px}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.free{color:var(--ok);background:rgba(21,168,101,.1);border-color:rgba(21,168,101,.25)}
.chip.paid{color:#8a6100;background:rgba(201,150,43,.16);border-color:rgba(201,150,43,.4)}
html.dark .chip.paid{color:#f0c060}
.chip.trip{color:var(--acc);background:var(--accs);border-color:rgba(0,59,135,.25)}
.chip.full,.chip.no{color:var(--no);background:rgba(214,51,74,.1);border-color:rgba(214,51,74,.25)}
.chip.ok{color:var(--ok);background:rgba(21,168,101,.1);border-color:rgba(21,168,101,.25)}
.chip.wait{color:var(--wait);background:rgba(201,138,0,.12);border-color:rgba(201,138,0,.3)}
.stats{display:flex;gap:12px;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:7px}
.news{padding:14px 15px}
.news .nh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-bottom:5px}
.news .nh b{color:var(--acc)}
.news p{margin:0;white-space:pre-line;font-size:14.5px}
.empty{text-align:center;padding:38px 20px;color:var(--mut)}
.empty .e{font-size:42px;margin-bottom:8px}
.skel{height:96px;border-radius:22px;background:linear-gradient(90deg,var(--card) 0%,var(--field) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* детали и формы */
.back{appearance:none;border:0;background:none;color:var(--acc);font-weight:700;padding:4px 0 12px;cursor:pointer}
.hero{padding:20px;text-align:center}
.poster{margin:-6px -6px 14px;border-radius:18px;overflow:hidden;background:var(--field);border:1px solid var(--line)}
.poster img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#000}
.poster-ph{aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(150deg,#003b87,#2a64c4 60%,#7fb0ff);color:#fff;font-size:56px;font-weight:900;letter-spacing:-2px}
.hero h2{margin:0 0 8px;font-size:22px;letter-spacing:-.3px;line-height:1.2}
.facts{display:grid;gap:8px;text-align:left;margin-top:14px}
.fact{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:14px}
.fact i{font-style:normal;width:20px;text-align:center}
.desc{margin:14px 2px 0;color:var(--mut);text-align:left;white-space:pre-line}
.sec{margin-top:14px;padding:18px}
.sec h4{margin:0 0 12px;font-size:16px}
label{display:block;font-size:11.5px;font-weight:800;color:var(--mut);margin:13px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.sec label:first-of-type{margin-top:0}
input[type=text],input[type=tel],input[type=number],input[type=datetime-local],input[type=url],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.bad{border-color:var(--no)!important;box-shadow:0 0 0 3px rgba(214,51,74,.15)!important}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px}
.row2>div{min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:16px;background:var(--field);border:1px solid var(--line)}
.seg button{appearance:none;border:0;background:none;padding:10px;border-radius:12px;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.pup{border-radius:16px;border:1.5px dashed var(--line);background:var(--field);cursor:pointer;overflow:hidden;text-align:center}
.pup .ph{padding:26px 14px;color:var(--mut);font-size:14px}.pup .ph b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.pup img{display:block;width:100%;max-height:340px;object-fit:contain;background:#000}
.fld{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fld input[type=text]{flex:1;min-width:0}
.fld .req{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap;cursor:pointer;margin:0;text-transform:none;letter-spacing:0}
.fld .req input{width:18px;height:18px;accent-color:var(--acc)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.presets button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--acc);cursor:pointer}
.fbox{padding:10px;border-radius:14px;background:var(--field);border:1px solid var(--line);margin-bottom:8px}
.fbox .fld{margin-bottom:0}
.fbox select,.sel{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;outline:none}
.sel{width:100%;font-size:16px;padding:12px 12px;background:var(--field);border-radius:14px}
.pick{display:flex;flex-wrap:wrap;gap:8px;padding:4px;border-radius:16px;border:1px solid transparent}
.pick button{appearance:none;flex:1 1 auto;min-width:72px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font-weight:800;font-size:15px;padding:12px 14px;border-radius:14px;cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s}
.pick button:active{transform:scale(.96)}
.pick button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(0,59,135,.28)}
.pick.bad{border-color:var(--no)!important}
.multi .mrow{display:flex;gap:8px;margin-bottom:8px}.multi .mrow input{flex:1;min-width:0}
.multi .mrow .mini{flex:0 0 auto}
.addm{appearance:none;width:100%;border:1.5px dashed var(--line);background:none;color:var(--acc);font-weight:800;font-size:14px;padding:11px;border-radius:14px;cursor:pointer}
.fbox .opts{margin-top:8px}
.coc{display:flex;gap:6px;flex-wrap:wrap}
.coc button{appearance:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.coc button img,.coc button i{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--accs);display:grid;place-items:center;font-style:normal;font-size:12px}
.coc button.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
.linkbox{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:13.5px;word-break:break-all}
.linkbox span{flex:1;min-width:0}
.news .go{appearance:none;border:0;background:none;color:var(--acc);font-weight:800;padding:8px 0 0;cursor:pointer;font-size:14px}
.extra{display:block;margin-top:3px;font-size:12.5px;color:var(--mut)}
.pay{padding:14px;border-radius:16px;background:rgba(201,150,43,.12);border:1px dashed rgba(201,150,43,.6);margin-bottom:4px}
.pay b{display:block;font-size:20px;letter-spacing:.5px;margin:2px 0}
.copy{appearance:none;border:0;background:var(--gold);color:#2e1f00;font-weight:800;font-size:13px;padding:7px 12px;border-radius:10px;margin-top:6px;cursor:pointer}
.upload{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px dashed var(--line);background:var(--field);cursor:pointer}
.upload .th{width:52px;height:52px;border-radius:12px;background:var(--accs);display:grid;place-items:center;font-size:22px;overflow:hidden;flex:0 0 52px}
.upload .th img{width:100%;height:100%;object-fit:cover}
.btn{appearance:none;border:0;width:100%;font-weight:800;font-size:16px;padding:15px;border-radius:16px;margin-top:14px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 24px rgba(0,59,135,.28);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ghost{background:var(--field);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:10px 12px;font-size:14px;margin-top:0;border-radius:12px;width:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.err{color:var(--no);font-size:14px;margin-top:10px;text-align:center;min-height:1em}
.done{text-align:center;padding:30px 20px}
.done .big{font-size:64px;line-height:1;margin-bottom:10px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h2{margin:0 0 6px}.done p{margin:0;color:var(--mut)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{padding:10px 6px;border-radius:14px;background:var(--field);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--mut);font-weight:700}
.person{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
.person .pb{flex:1;min-width:0;font-size:13px;color:var(--mut)}
.person .pb b{display:block;color:var(--ink);font-size:14.5px}
.person .acts{display:flex;gap:6px}
.mini{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accs);flex:0 0 44px;display:grid;place-items:center;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:rgba(29,20,22,.94);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
</style>
</head>

  <div id="app"></div>
</div>

/* ---------- API ---------- */
async function api(action, data) {
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, initData: inTg ? tg.initData : '' }, data || {})) });
  return res.json();
}
async function call(action, data, btn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'Секунду…'; }
  let r; try { r = await api(action, data); } catch (e) { r = { ok: false, message: 'Нет связи. Попробуй ещё раз.' }; }
  if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; }
  if (!r.ok) haptic('n', 'error');
  return r;
}

/* ---------- форматирование ---------- */
const fmtDate = iso => {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return iso;
  const day = d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long', timeZone: 'Asia/Tashkent' });
  return day.charAt(0).toUpperCase() + day.slice(1) + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tashkent' });
};
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? Math.max(1, m) + ' мин назад' : m < 1440 ? Math.round(m / 60) + ' ч назад' : fmtDate(iso).split(',').slice(0, 2).join(','); };
const money = n => Number(n).toLocaleString('ru-RU').replace(/[\s,]/g, ' ') + ' сум';
const isImg = c => /^https?:\/\//.test(c || '');
const initial = t => esc((String(t || 'U').trim().match(/[A-Za-zА-Яа-яЁё0-9]/) || ['U'])[0].toUpperCase());

/* ---------- картинки ---------- */
function pickImage(maxSide, cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg', .84));
    };
    img.onerror = () => toast('Не получилось открыть картинку');
    img.src = url;
  };
  inp.click();
}

function normPhone(raw) {
  const s = String(raw || '').trim(), d = s.replace(/\D/g, '');
  if (/^(\d)\1+$/.test(d)) return null;
  if (d.length === 9) return '+998' + d;
  if (d.length === 12 && d.indexOf('998') === 0) return '+' + d;
  if (s.charAt(0) === '+' && d.length >= 10 && d.length <= 15 && d.indexOf('998') !== 0) return '+' + d;
  return null;
}
const FORM = ['fName', 'fCourse', 'fPhone'], FKEY = { fName: 'name', fCourse: 'course', fPhone: 'phone' };
function saveForm(f) { store.set('uwed_form', JSON.stringify(f)); try { inTg && tg.CloudStorage && tg.CloudStorage.setItem('form', JSON.stringify(f)); } catch (e) {} }
function fillForm() {
  const put = d => { if (d) FORM.forEach(id => { if ($(id) && d[FKEY[id]] && !$(id).value) $(id).value = d[FKEY[id]]; }); };
  try { put(JSON.parse(store.get('uwed_form') || 'null')); } catch (e) {}
  try { inTg && tg.CloudStorage && tg.CloudStorage.getItem('form', (e, v) => { if (!e && v) try { put(JSON.parse(v)); } catch (x) {} }); } catch (e) {}
  const u = inTg && tg.initDataUnsafe.user; if (u && $('fName') && !$('fName').value) $('fName').value = [u.last_name, u.first_name].filter(Boolean).join(' ');
  FORM.forEach(id => $(id) && $(id).addEventListener('input', () => $(id).classList.remove('bad')));
}
function askWrite() {
  const u = inTg && tg.initDataUnsafe.user;
  if (!u || u.allows_write_to_pm !== false || !tg.requestWriteAccess) return Promise.resolve();
  return new Promise(r => { try { tg.requestWriteAccess(() => r()); } catch (e) { r(); } });
}
async function copyText(t, msg) { try { await navigator.clipboard.writeText(t); toast(msg); } catch (x) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast(msg); } catch (y) { toast(t); } a.remove(); } haptic('n', 'success'); }
function shareEvent(e) {
  const url = evLink(e.id), text = e.title + ' · ' + fmtDate(e.date);
  const share = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
  try { if (inTg) return tg.openTelegramLink(share); } catch (x) {}
  copyText(url, 'Ссылка скопирована');
}
function openLink(u) { if (!u) return; if (/^@/.test(u)) u = 'https://t.me/' + u.slice(1); try { if (inTg && /^https:\/\/t\.me\//.test(u)) return tg.openTelegramLink(u); if (inTg) return tg.openLink(u); } catch (e) {} window.open(u, '_blank'); }

      ${f.type === 'choice' ? `<input class="opts" type="text" data-fo="${i}" placeholder="Варианты через запятую: UNSC, UNGA, HRC" value="${esc(f.options)}">` : ''}</div>`).join('');
    const used = flds.map(f => f.label.trim().toLowerCase());
    $('presets').innerHTML = (flds.length < 8 ? PRESETS.map((p, j) => used.indexOf(p.label.toLowerCase()) < 0 ? `<button type="button" data-fp="${j}">＋ ${esc(p.label)}</button>` : '').join('') + '<button type="button" data-fp="-1">＋ Своё поле</button>' : '');
    app.querySelectorAll('[data-fl]').forEach(el => el.oninput = () => { flds[+el.dataset.fl].label = el.value; el.classList.remove('bad'); });
    app.querySelectorAll('[data-fo]').forEach(el => el.oninput = () => { flds[+el.dataset.fo].options = el.value; el.classList.remove('bad'); });
    app.querySelectorAll('[data-fr]').forEach(el => el.onchange = () => { flds[+el.dataset.fr].required = el.checked; });
    app.querySelectorAll('[data-fm]').forEach(el => el.onchange = () => { flds[+el.dataset.fm].multi = el.checked; });
    app.querySelectorAll('[data-ft]').forEach(el => el.onchange = () => { flds[+el.dataset.ft].type = el.value; drawF(); const o = app.querySelector(`[data-fo="${el.dataset.ft}"]`); o && o.focus(); });
    app.querySelectorAll('[data-fd]').forEach(el => el.onclick = () => { flds.splice(+el.dataset.fd, 1); drawF(); });
    app.querySelectorAll('[data-fp]').forEach(el => el.onclick = () => {
      const p = PRESETS[+el.dataset.fp];
      flds.push(p ? { label: p.label, required: true, type: p.type || 'text', options: (p.options || []).join(', '), multi: !!p.multi } : { label: '', required: false, type: 'text', options: '', multi: false });
      drawF(); if (!p) { const ins = app.querySelectorAll('[data-fl]'); ins[ins.length - 1].focus(); }
    });
  };
  const drawCo = clubs => {
    if (!$('coc')) return;
    const own = S.me.club ? S.me.club.id : (e ? e.clubId : '');
    const list = clubs.filter(c => c.id !== own);
    $('coc').innerHTML = list.length ? list.map(c => `<button type="button" data-co="${esc(c.id)}" class="${co.indexOf(c.id) >= 0 ? 'on' : ''}">${c.avatar ? `<img src="${esc(c.avatar)}" alt="">` : `<i>${initial(c.name)}</i>`}${esc(c.name)}</button>`).join('') : '<div class="hint">Других одобренных клубов пока нет</div>';
    app.querySelectorAll('[data-co]').forEach(b => b.onclick = () => { const id = b.dataset.co, k = co.indexOf(id); k >= 0 ? co.splice(k, 1) : co.length < 5 && co.push(id); b.classList.toggle('on', co.indexOf(id) >= 0); haptic('i', 'light'); });
  };
  if (canCo) call('clubs').then(r => drawCo(r.ok ? r.clubs : []));
  app.querySelectorAll('[data-type]').forEach(b => b.onclick = () => setType(b.dataset.type));
  setType(type); showPoster(); drawF();
  const save = async (publish, btn) => {
    $('err').textContent = '';
    const ev = { id: e ? e.id : '', type, title: $('eTitle').value.trim(), date: fromLocalInput($('eDate').value), capacity: $('eCap').value,
      place: $('ePlace').value.trim(), description: $('eDesc').value.trim(), chat: $('eChat').value.trim(), approval: type !== 'trip' && $('eAppr').checked,
      price: type === 'trip' ? $('ePrice').value : 0, card: type === 'trip' ? $('eCard').value.trim() : '', holder: type === 'trip' ? $('eHolder').value.trim() : '',
      cover: coverData ? '' : cover, coauthors: canCo ? co : undefined,
      fields: flds.map(f => ({ label: f.label.trim().replace(/[:\n]/g, ' '), required: f.required, type: f.type, multi: f.type !== 'choice' && f.multi, options: f.options.split(',').map(x => x.trim()).filter(Boolean) })).filter(f => f.label) };
    const bad = []; if (ev.title.length < 3) bad.push('eTitle');
    const yr = ev.date ? new Date(ev.date).getFullYear() : 0, ny = new Date().getFullYear();
    if (!ev.date || yr < ny - 1 || yr > ny + 2) { bad.push('eDate'); if (ev.date) { $('eDate').classList.add('bad'); $('err').textContent = 'Проверь год в дате — сейчас стоит ' + yr; haptic('n', 'error'); return; } }
    if (publish && ev.date && new Date(ev.date).getTime() < Date.now() - 3 * 3600e3) { $('eDate').classList.add('bad'); $('err').textContent = 'Эта дата уже прошла'; haptic('n', 'error'); return; }
    flds.forEach((f, i) => { if (f.label.trim() && f.type === 'choice' && !f.options.split(',').some(x => x.trim())) bad.push(app.querySelector(`[data-fo="${i}"]`)); });
    if (type === 'trip' && Number(ev.price) > 0) { if (ev.card.replace(/\D/g, '').length < 12) bad.push('eCard'); if (ev.holder.length < 3) bad.push('eHolder'); }
    bad.forEach(x => (typeof x === 'string' ? $(x) : x).classList.add('bad')); if (bad.length) { $('err').textContent = 'Заполни отмеченные поля'; haptic('n', 'error'); return; }
    const r = await call('eventSave', { event: ev, cover: coverData, publish, notifyAll: $('eNotify').checked }, btn);
    if (!r.ok) { $('err').textContent = r.message; return; }
    haptic('n', 'success');
    toast(publish ? '🚀 Опубликовано' + (r.notified ? ' · оповещение получат ' + r.notified + ' чел.' : '') : 'Сохранено');
    await refresh(); S.stack = []; showHome();
  };
  $('bDraft').onclick = () => save(false, $('bDraft'));
  $('bPub').onclick = () => save(true, $('bPub'));
}

async function showManage(id) {
  render('<div class="skel"></div>', true);
  const [list, parts] = await Promise.all([call('myEvents'), call('participants', { eventId: id })]);
  if (list.ok) S.mine = list.events;
  const e = (S.mine || []).find(x => x.id === id); if (!e) return goBack();
  const P = parts.ok ? parts.list : [];
  const acc = P.filter(p => p.status === 'Принят').length, wait = P.filter(p => p.status === 'На проверке').length;
  const admin = S.me.admin;
  render(`<div class="glass hero" style="padding:16px"><div class="chips" style="justify-content:center;margin:0 0 8px">${stChip(e.status)}${e.type === 'trip' ? '<span class="chip trip">Трип</span>' : ''}</div>
    <h2>${esc(e.title)}</h2><div class="hint">${esc(fmtDate(e.date))}${e.place ? ' · ' + esc(e.place) : ''}</div>
    <div class="grid4"><div class="stat"><b>${e.views}</b><span>Просмотры</span></div><div class="stat"><b>${e.registered}</b><span>Записались</span></div>
      <div class="stat"><b>${acc}</b><span>Приняты</span></div><div class="stat"><b>${wait}</b><span>Ждут</span></div></div>
    <div class="btns" style="margin-top:12px"><button class="btn small ghost" id="bEdit">✏️ Изменить</button>
      ${e.status === 'Опубликован' ? '<button class="btn small ghost" id="bHide">🙈 Скрыть</button>' : '<button class="btn small" id="bPub">🚀 Опубликовать</button>'}
      <button class="btn small ghost" id="bDel">🗑</button></div></div>
    ${admin ? `<div class="glass sec"><h4>👑 Гегемония</h4><div class="hint" style="margin-top:-6px">Настоящих просмотров: ${e.realViews || 0}. Сколько добавить сверху:</div>
      <div style="display:flex;gap:8px;margin-top:8px"><input type="number" id="boost" min="0" value="${e.boost || 0}"><button class="btn small" id="bBoost">Сохранить</button></div></div>` : ''}
    <div class="glass sec"><h4>🔗 Ссылка на регистрацию</h4><div class="hint" style="margin:-6px 0 8px">Вставь в пост или сторис — по ней откроется бот и сразу этот ивент${e.status === 'Опубликован' ? '' : ' (заработает после публикации)'}.</div>
      <div class="linkbox"><span id="evUrl">${esc(evLink(e.id))}</span></div>
      <div class="btns" style="margin-top:8px"><button class="btn small" id="bLink">📋 Скопировать</button><button class="btn small ghost" id="bShare">📤 Поделиться</button></div></div>
    <div class="glass sec"><h4>📣 Рассылка участникам (${acc})</h4><textarea id="bcText" placeholder="Например: сбор у главного входа в 7:45, не опаздывайте!"></textarea>
      <button class="btn" id="bBc" ${acc ? '' : 'disabled'}>Отправить</button></div>
    <div class="glass sec"><h4>👥 Участники (${P.length})</h4><div class="btns" style="margin:-4px 0 10px"><button class="btn small ghost" id="bCopy">📋 Скопировать список</button></div>
      <div class="list" style="gap:8px">${P.length ? P.map(p => `<div class="person"><div class="pb"><b>${esc(p.name)}</b>${esc(p.course)} · ${esc(p.phone)}${p.username ? ' · ' + esc(p.username) : ' · <i style="font-style:normal;color:var(--wait)">без ника</i>'}${p.paid ? ' · 💳 скрин в боте' : ''}${Object.keys(p.extra || {}).map(k => `<span class="extra">${esc(k)}: <b style="display:inline;font-size:inherit">${esc(p.extra[k])}</b></span>`).join('')}</div>
        <div class="acts">${p.status === 'На проверке' ? `<button class="mini" data-ok="${p.id}">✅</button><button class="mini" data-no="${p.id}">❌</button>` : stChip(p.status)}</div></div>`).join('') : '<div class="hint">Пока никто не записался</div>'}</div></div>`, true);
  $('bEdit').onclick = () => go(() => showEditor(id));
  $('bLink').onclick = () => copyText(evLink(e.id), 'Ссылка скопирована — вставляй в пост');
  $('bShare').onclick = () => shareEvent(e);
  const setSt = async (st, btn) => { const r = await call('eventStatus', { eventId: id, status: st }, btn); if (!r.ok) return toast(r.message); await refresh(); toast(st === 'delete' ? 'Удалено' : 'Готово'); st === 'delete' ? (S.stack = [], showHome()) : showManage(id); };
  if ($('bHide')) $('bHide').onclick = () => setSt('hide', $('bHide'));
  if ($('bPub')) $('bPub').onclick = () => setSt('pub', $('bPub'));
  $('bDel').onclick = () => { const ok = () => setSt('delete', $('bDel')); if (inTg && tg.showConfirm) tg.showConfirm('Удалить ивент «' + e.title + '»?', y => y && ok()); else if (confirm('Удалить ивент?')) ok(); };
  if ($('bBoost')) $('bBoost').onclick = async () => { const r = await call('boost', { eventId: id, boost: $('boost').value }, $('bBoost')); if (r.ok) { toast('Просмотров теперь: ' + r.views); refresh(); } else toast(r.message); };
  $('bBc').onclick = async () => { const t = $('bcText').value.trim(); if (t.length < 2) return $('bcText').classList.add('bad'); const r = await call('broadcast', { eventId: id, text: t }, $('bBc')); if (r.ok) { $('bcText').value = ''; toast('Отправляем ' + r.queued + ' участникам, в течение минуты'); } else toast(r.message); };
  $('bCopy').onclick = async () => { const xk = (e.fields || []).map(f => f.label); P.forEach(p => Object.keys(p.extra || {}).forEach(k => xk.indexOf(k) < 0 && xk.push(k)));
    const txt = [['ФИО', 'Курс', 'Телефон'].concat(xk, ['Telegram', 'Статус']).join('\t')].concat(P.map(p => [p.name, p.course, p.phone].concat(xk.map(k => (p.extra || {})[k] || ''), [p.username, p.status]).join('\t'))).join('\n'); try { await navigator.clipboard.writeText(txt); toast('Список скопирован, вставь в Excel или Google Таблицы'); } catch (x) { toast('Не получилось скопировать'); } };
  app.querySelectorAll('[data-ok],[data-no]').forEach(b => b.onclick = async () => {
    const ok = !!b.dataset.ok, acts = b.parentNode, prev = acts.innerHTML;
    acts.innerHTML = stChip(ok ? 'Принят' : 'Отклонён'); haptic('n', 'success');  // сразу показываем результат
    const r = await call('regStatus', { regId: b.dataset.ok || b.dataset.no, ok });
    if (!r.ok) { acts.innerHTML = prev; toast(r.message || 'Не сохранилось, попробуй ещё раз'); showManage(id); }
  });
}

function showAnnounce() {
  render(`<div class="glass sec" style="margin-top:0"><h4>📢 Объявление</h4><p class="hint" style="margin:-6px 0 8px">Появится в ленте у всех над ивентами.</p>
    <textarea id="nText" placeholder="Набор в команду, итоги ивента, важная новость…"></textarea>
    <label>Привязать к ивенту</label><select class="sel" id="nEv"><option value="">— без ивента —</option>${S.events.map(e => `<option value="${esc(e.id)}">${esc(e.title)} · ${esc(fmtDate(e.date))}</option>`).join('')}</select>
    <div class="hint">Под объявлением появится кнопка «Записаться», ведущая в этот ивент.</div>
    <label class="check"><input type="checkbox" id="nAll"> Отправить всем в бот</label>
    <button class="btn" id="bGo">Опубликовать</button><div class="err" id="err"></div></div>`, true);
  $('bGo').onclick = async () => {
    const t = $('nText').value.trim(); if (t.length < 3) { $('nText').classList.add('bad'); return; }
    const r = await call('announce', { text: t, eventId: $('nEv').value, notifyAll: $('nAll').checked }, $('bGo'));
    if (!r.ok) { $('err').textContent = r.message; return; }
    toast('Опубликовано' + (r.notified ? ' · получат ' + r.notified + ' чел.' : '')); await refresh(); home('events');
  };
}

/* ---------- админ ---------- */
async function tabAdmin() {
  skeleton();
  const [r, ev] = await Promise.all([call('adminData'), call('myEvents')]);
  if (S.tab !== 'admin') return;
  if (!r.ok) { $('list').innerHTML = `<div class="empty glass">${esc(r.message || 'Нет доступа')}</div>`; return; }
  if (ev.ok) S.mine = ev.events;
  const pend = r.clubs.filter(c => c.status === 'На проверке'), okc = r.clubs.filter(c => c.status === 'Принят');
  const clubRow = c => `<div class="person">${c.avatar ? `<img class="ava" src="${esc(c.avatar)}">` : '<div class="ava">🏛</div>'}<div class="pb"><b>${esc(c.club)}</b>${esc(c.name)} · ${esc(c.course)}${c.username ? ' · ' + esc(c.username) : ''}${c.link ? `<br><a href="${esc(c.link)}" data-link>${esc(c.link)}</a>` : ''}</div>
    <div class="acts">${c.status === 'На проверке' ? `<button class="mini" data-cok="${c.id}">✅</button><button class="mini" data-cno="${c.id}">❌</button>` : stChip(c.status)}</div></div>`;
  $('list').innerHTML = `<div class="glass grid4" style="padding:12px;margin:0;grid-template-columns:repeat(3,1fr)"><div class="stat"><b>${r.users}</b><span>Пользователей</span></div><div class="stat"><b>${okc.length}</b><span>Клубов</span></div><div class="stat"><b>${S.events.length}</b><span>Активных ивентов</span></div></div>
    <div class="btns"><button class="btn" id="bNew">＋ Ивент от Студсоюза</button><button class="btn ghost" id="bNews">📢 Объявление</button></div>
    <div class="glass sec" style="margin-top:0"><h4>🏛 Заявки клубов ${pend.length ? '(' + pend.length + ')' : ''}</h4><div class="list" style="gap:8px">${pend.length ? pend.map(clubRow).join('') : '<div class="hint">Новых заявок нет</div>'}</div></div>
    ${okc.length ? `<div class="glass sec" style="margin-top:0"><h4>✅ Клубы</h4><div class="list" style="gap:8px">${okc.map(clubRow).join('')}</div></div>` : ''}
    <div class="glass sec" style="margin-top:0"><h4>🛡 Админы</h4><div class="list" style="gap:8px">${r.admins.map(a => `<div class="person"><div class="ava">${a.head ? '👑' : '🛡'}</div><div class="pb"><b>${esc(a.name || 'ID ' + a.id)}</b>${esc(a.username || '')}${a.head ? ' · главный' : ''}</div>${r.head && !a.head ? `<div class="acts"><button class="mini" data-unadmin="${esc(a.username || a.id)}">Снять</button></div>` : ''}</div>`).join('')}</div>
      ${r.head ? `<label>Назначить админа</label><div style="display:flex;gap:8px"><input type="text" id="newAdmin" placeholder="@username или Telegram ID"><button class="btn small" id="bAddAdmin">Назначить</button></div><div class="hint">Человек должен хотя бы раз открыть бота.</div>` : ''}</div>
    <div class="sect">Все ивенты</div>${ev.ok && ev.events.length ? ev.events.map(e => evCard(e, { status: 1 })).join('') : '<div class="hint">Ивентов пока нет</div>'}`;
  $('bNew').onclick = () => go(() => showEditor(null));
  $('bNews').onclick = () => go(showAnnounce);
  $('list').querySelectorAll('[data-ev]').forEach(b => b.onclick = () => go(() => showManage(b.dataset.ev)));
  $('list').querySelectorAll('[data-link]').forEach(a => a.onclick = x => { x.preventDefault(); openLink(a.getAttribute('href')); });
  $('list').querySelectorAll('[data-cok],[data-cno]').forEach(b => b.onclick = async () => { const r2 = await call('clubDecide', { clubId: b.dataset.cok || b.dataset.cno, ok: !!b.dataset.cok }, b); if (r2.ok) { haptic('n', 'success'); toast(b.dataset.cok ? 'Клуб одобрен' : 'Отклонено'); tabAdmin(); } else toast(r2.message); });
  if ($('bAddAdmin')) $('bAddAdmin').onclick = async () => { const r2 = await call('setAdmin', { who: $('newAdmin').value.trim(), on: true }, $('bAddAdmin')); if (r2.ok) { toast('Назначен админом'); tabAdmin(); } else toast(r2.message); };
  $('list').querySelectorAll('[data-unadmin]').forEach(b => b.onclick = async () => { const r2 = await call('setAdmin', { who: b.dataset.unadmin, on: false }, b); if (r2.ok) { toast('Права сняты'); tabAdmin(); } else toast(r2.message); });
}

/* ---------- старт ---------- */
// Лента кешируется на телефоне: при повторном открытии показываем её сразу,
// а свежие данные с сервера подтягиваем в фоне.
const FEED_KEY = 'uwed_feed_v1';
const myUid = () => (inTg && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0;
function saveFeed() { store.set(FEED_KEY, JSON.stringify({ t: Date.now(), uid: myUid(), events: S.events, news: S.news, me: S.me })); }
function loadFeed() {
  try { const f = JSON.parse(store.get(FEED_KEY) || 'null'); if (f && f.uid === myUid() && Date.now() - f.t < 7 * 864e5) return f; } catch (e) {}
  return null;
}
async function refresh() {
  const r = await call(inTg ? 'init' : 'events');
  if (r.ok) { S.events = r.events || []; S.news = r.news || S.news; if (r.me) S.me = r.me; saveFeed(); }
  return r;
}
(async () => {
  const hello = () => { if (S.me && inTg) { const u = tg.initDataUnsafe.user; $('hello').textContent = 'Привет, ' + (u.first_name || 'UWEDIAN') + '!'; } };
  const sp = (inTg && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('event');
  let opened = false;
  const openDeep = () => { if (!opened && sp && S.events.find(e => e.id === sp)) { opened = true; go(() => showEvent(sp)); } };
  const cached = loadFeed();
  if (cached) { S.events = cached.events || []; S.news = cached.news || []; S.me = cached.me || null; hello(); showHome(); openDeep(); }
  else app.innerHTML = '<div class="tabs glass"><button class="tab on">Ивенты</button><button class="tab">Мои заявки</button></div><div class="list"><div class="skel"></div><div class="skel"></div></div>';
  const r = await refresh();
  if (!r.ok) {
    if (cached) toast('Нет связи — показываю сохранённую ленту');
    else app.innerHTML = `<div class="empty glass"><div class="e">📡</div>${esc(r.message || 'Не получилось загрузить. Проверь интернет и открой ещё раз.')}</div>`;
    return;
  }
  hello();
  if (!S.stack.length) showHome();  // не перерисовываем, если человек уже открыл ивент или форму
  openDeep();
})();
window.__app = { S, call, go, showEvent, home };
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>UWED SU · Ивенты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#eef1f8;--bg2:#e3e8f5;--card:rgba(255,255,255,.72);--card-b:rgba(255,255,255,.9);--ink:#121633;--mut:#5d6385;--line:rgba(18,22,51,.08);
  --acc:#2d4bff;--acc2:#7b5cff;--gold:#f2b632;--ok:#15a865;--wait:#d99400;--no:#e0475b;--shadow:0 10px 30px rgba(34,46,110,.12);
  --field:rgba(255,255,255,.85);
}
html.dark{
  --bg:#0b0d1a;--bg2:#12152b;--card:rgba(28,32,62,.6);--card-b:rgba(255,255,255,.08);--ink:#eef0ff;--mut:#9ba1c7;--line:rgba(255,255,255,.08);
  --acc:#6f86ff;--acc2:#a78bff;--shadow:0 10px 30px rgba(0,0,0,.35);--field:rgba(255,255,255,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:0}
.b1{width:320px;height:320px;background:var(--acc);top:-120px;left:-100px;opacity:.28}
.b2{width:280px;height:280px;background:var(--acc2);top:40px;right:-140px;opacity:.25}
.b3{width:260px;height:260px;background:var(--gold);bottom:-120px;left:20%;opacity:.15}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px 0}
.glass{background:var(--card);border:1px solid var(--card-b);border-radius:22px;box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
header{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 18px rgba(45,75,255,.35)}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header p{margin:0;color:var(--mut);font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;gap:4px;margin-bottom:14px}
.tab{appearance:none;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;padding:10px;border-radius:16px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 16px rgba(45,75,255,.3)}
.list{display:flex;flex-direction:column;gap:12px}
.ev{display:flex;gap:14px;padding:14px;cursor:pointer;transition:transform .12s;text-align:left;width:100%;font:inherit;color:inherit}
.ev:active{transform:scale(.985)}
.cover{flex:0 0 64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;overflow:hidden;
  background:linear-gradient(135deg,rgba(45,75,255,.18),rgba(123,92,255,.18));border:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover}
.ev .b{flex:1;min-width:0}
.ev h3{margin:0 0 4px;font-size:16px;line-height:1.25}
.meta{color:var(--mut);font-size:13px;display:flex;flex-direction:column;gap:2px}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--mut)}
.chip.free{color:var(--ok);background:rgba(21,168,101,.1);border-color:rgba(21,168,101,.25)}
.chip.paid{color:#9a6a00;background:rgba(242,182,50,.16);border-color:rgba(242,182,50,.35)}
html.dark .chip.paid{color:var(--gold)}
.chip.full{color:var(--no);background:rgba(224,71,91,.1);border-color:rgba(224,71,91,.25)}
.chip.ok{color:var(--ok);background:rgba(21,168,101,.1);border-color:rgba(21,168,101,.25)}
.chip.wait{color:var(--wait);background:rgba(217,148,0,.12);border-color:rgba(217,148,0,.3)}
.chip.no{color:var(--no);background:rgba(224,71,91,.1);border-color:rgba(224,71,91,.25)}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .e{font-size:44px;margin-bottom:8px}
.skel{height:92px;border-radius:22px;background:linear-gradient(90deg,var(--card) 0%,var(--field) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* детали */
.hero{padding:20px;text-align:center}
.hero .cover{width:84px;height:84px;font-size:44px;margin:0 auto 12px;border-radius:24px}
.hero h2{margin:0 0 10px;font-size:22px;letter-spacing:-.3px;line-height:1.2}
.facts{display:grid;gap:8px;text-align:left;margin-top:14px}
.fact{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:14px}
.fact i{font-style:normal;width:20px;text-align:center}
.desc{margin:14px 2px 0;color:var(--mut);text-align:left;white-space:pre-line}
.sec{margin-top:14px;padding:18px}
.sec h4{margin:0 0 12px;font-size:16px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.4px}
label:first-of-type{margin-top:0}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(45,75,255,.15)}
input.bad{border-color:var(--no);box-shadow:0 0 0 3px rgba(224,71,91,.15)}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.pay{padding:14px;border-radius:16px;background:rgba(242,182,50,.12);border:1px dashed rgba(242,182,50,.6);margin-bottom:4px}
.pay b{display:block;font-size:20px;letter-spacing:.3px;margin:2px 0}
.copy{appearance:none;border:0;background:var(--gold);color:#3a2a00;font:inherit;font-weight:800;font-size:13px;padding:7px 12px;border-radius:10px;margin-top:6px;cursor:pointer}
.upload{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px dashed var(--line);background:var(--field);cursor:pointer}
.upload .th{width:52px;height:52px;border-radius:12px;background:rgba(45,75,255,.12);display:grid;place-items:center;font-size:22px;overflow:hidden;flex:0 0 52px}
.upload .th img{width:100%;height:100%;object-fit:cover}
.upload.bad{border-color:var(--no)}
.btn{appearance:none;border:0;width:100%;font:inherit;font-weight:800;font-size:16px;padding:15px;border-radius:16px;margin-top:16px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 24px rgba(45,75,255,.3);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ghost{background:var(--field);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.back{appearance:none;border:0;background:none;color:var(--acc);font:inherit;font-weight:700;padding:4px 0 12px;cursor:pointer}
.done{text-align:center;padding:30px 20px}
.done .big{font-size:64px;line-height:1;margin-bottom:10px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h2{margin:0 0 6px}
.done p{margin:0;color:var(--mut)}
.err{color:var(--no);font-size:14px;margin-top:10px;text-align:center;min-height:1em}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;
  background:rgba(18,22,51,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <header>
    <div class="logo">UWED<br>SU</div>
    <div><h1>Ивенты Студсоюза</h1><p id="hello">UWED Students' Union</p></div>
  </header>

  <div id="vList" class="view">
    <div class="tabs glass">
      <button class="tab on" data-t="events">Ивенты</button>
      <button class="tab" data-t="my">Мои заявки</button>
    </div>
    <div id="list" class="list"></div>
  </div>

  <div id="vEvent" class="view hidden">
    <button class="back" id="bBack">← Все ивенты</button>
    <div class="glass hero" id="hero"></div>
    <div class="glass sec" id="formBox">
      <h4>Регистрация</h4>
      <div id="payBox" class="hidden">
        <div class="pay">
          <div style="font-size:13px;color:var(--mut)">Переведи <span id="payPrice"></span> на карту:</div>
          <b id="payCard"></b>
          <button class="copy" id="bCopy" type="button">Скопировать номер</button>
        </div>
      </div>
      <label for="fName">ФИО</label>
      <input type="text" id="fName" autocomplete="name" placeholder="Фамилия Имя">
      <label for="fCourse">Курс и факультет</label>
      <input type="text" id="fCourse" placeholder="2 курс, Международные отношения">
      <label for="fPhone">Телефон</label>
      <input type="tel" id="fPhone" autocomplete="tel" placeholder="+998 90 123 45 67">
      <label for="fHemis">HEMIS ID <span style="text-transform:none;font-weight:500">(если есть)</span></label>
      <input type="text" id="fHemis" inputmode="numeric" placeholder="Необязательно">
      <div id="shotBox" class="hidden">
        <label>Скриншот оплаты</label>
        <div class="upload" id="upload">
          <div class="th" id="shotTh">📎</div>
          <div><div style="font-weight:700" id="shotT">Прикрепить скриншот</div><div class="hint" style="margin:0">Чек из Click, Payme или банка</div></div>
        </div>
        <input type="file" id="fShot" accept="image/*" class="hidden">
      </div>
      <button class="btn" id="bSend">Записаться</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="vDone" class="view hidden">
    <div class="glass done">
      <div class="big" id="dIcon">🎉</div>
      <h2 id="dTitle">Ты записан(а)!</h2>
      <p id="dText"></p>
      <button class="btn hidden" id="bChat">Вступить в чат участников</button>
      <button class="btn ghost" id="bHome">К ивентам</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxFRMRUNXSMGynPD4jjxi9xBdD8XokhnLwP2Rsz62e5POtKQab_FrU7XO1ZR2mUwzR7Nw/exec';   // адрес Apps Script (…/exec)
const MOCK = /[?&]mock=1/.test(location.search) || !API;

const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const $ = id => document.getElementById(id);

if (tg) {
  try {
    tg.ready(); tg.expand();
    if (tg.colorScheme === 'dark') document.documentElement.classList.add('dark');
    tg.onEvent && tg.onEvent('themeChanged', () => document.documentElement.classList.toggle('dark', tg.colorScheme === 'dark'));
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg);
  } catch (e) {}
} else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');

const me = inTg && tg.initDataUnsafe.user;
if (me) $('hello').textContent = 'Привет, ' + me.first_name + '!';
const haptic = (t, v) => { try { if (inTg) t === 'n' ? tg.HapticFeedback.notificationOccurred(v) : tg.HapticFeedback.impactOccurred(v); } catch (e) {} };
let toastT; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- API ---------- */
const mockDB = {
  events: [
    { id: 'debates1', title: 'Дебаты: AI в образовании', date: new Date(Date.now() + 6 * 864e5).toISOString(), place: 'UWED, актовый зал', description: 'Открытые дебаты в британском формате. Можно прийти зрителем или спикером.', capacity: 60, left: 37, price: 0, card: '', cover: '🎤' },
    { id: 'trip1', title: 'Поездка в Чимган', date: new Date(Date.now() + 13 * 864e5).toISOString(), place: 'Сбор у главного входа UWED', description: 'Однодневная поездка в горы: автобус, обед, гид.\nБери тёплые вещи.', capacity: 40, left: 4, price: 150000, card: '8600 1234 5678 9012 (Имя Фамилия)', cover: '🏔' },
    { id: 'movie1', title: 'Кино-вечер: «Интерстеллар»', date: new Date(Date.now() + 2 * 864e5).toISOString(), place: 'Ауд. 305', description: 'Попкорн за наш счёт.', capacity: 30, left: 0, price: 0, card: '', cover: '🎬' },
  ],
  my: [],
};
async function api(action, data) {
  if (MOCK) {
    await new Promise(r => setTimeout(r, 450));
    if (action === 'events') return { ok: true, events: mockDB.events };
    if (action === 'my') return { ok: true, list: mockDB.my };
    if (action === 'register') {
      const ev = mockDB.events.find(e => e.id === data.eventId);
      if (mockDB.my.find(m => m.eventId === ev.id)) return { ok: false, error: 'dup', message: 'Ты уже записан(а) на этот ивент' };
      const status = ev.price > 0 ? 'На проверке' : 'Принят';
      mockDB.my.unshift({ id: 'R1', eventId: ev.id, title: ev.title, date: ev.date, place: ev.place, status, chat: status === 'Принят' ? 'https://t.me/+example' : '', cover: ev.cover });
      if (ev.left) ev.left--;
      return { ok: true, id: 'R1', status, chat: status === 'Принят' ? 'https://t.me/+example' : '' };
    }
  }
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, initData: inTg ? tg.initData : '' }, data || {})) });
  return res.json();
}

/* ---------- форматирование ---------- */
const fmtDate = iso => {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return iso;
  const day = d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long', timeZone: 'Asia/Tashkent' });
  const t = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tashkent' });
  return day.charAt(0).toUpperCase() + day.slice(1) + ', ' + t;
};
const money = n => Number(n).toLocaleString('ru-RU').replace(/,/g, ' ') + ' сум';
const coverHTML = c => /^https?:\/\//.test(c) ? `<img src="${esc(c)}" alt="">` : esc(c || '🎟');
const seatsChip = e => e.left === null || e.left === undefined ? '' :
  e.left === 0 ? '<span class="chip full">Мест нет</span>' : `<span class="chip">${e.left <= 5 ? '🔥 ' : ''}Осталось ${e.left}</span>`;
const priceChip = e => e.price > 0 ? `<span class="chip paid">${money(e.price)}</span>` : '<span class="chip free">Бесплатно</span>';
const stChip = s => `<span class="chip ${s === 'Принят' ? 'ok' : s === 'Отклонён' ? 'no' : 'wait'}">${s === 'Принят' ? '✅ ' : s === 'Отклонён' ? '❌ ' : '⏳ '}${esc(s)}</span>`;

/* ---------- экраны ---------- */
let events = [], cur = null, tab = 'events', shot = null;
function show(v) {
  ['vList', 'vEvent', 'vDone'].forEach(x => $(x).classList.toggle('hidden', x !== v));
  window.scrollTo(0, 0);
  if (tg && tg.BackButton) { v === 'vList' ? tg.BackButton.hide() : tg.BackButton.show(); }
}
if (tg && tg.BackButton) tg.BackButton.onClick(() => { show('vList'); render(); });

function skeleton() { $('list').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; }
async function loadEvents() {
  skeleton();
  try { const r = await api('events'); events = r.events || []; }
  catch (e) { $('list').innerHTML = '<div class="empty glass"><div class="e">📡</div>Не получилось загрузить. Проверь интернет и открой ещё раз.</div>'; return; }
  render();
}
async function render() {
  if (tab === 'events') {
    if (!events.length) { $('list').innerHTML = '<div class="empty glass"><div class="e">🗓</div>Скоро здесь появятся новые ивенты</div>'; return; }
    $('list').innerHTML = events.map(e => `
      <button class="ev glass" data-id="${esc(e.id)}">
        <div class="cover">${coverHTML(e.cover)}</div>
        <div class="b"><h3>${esc(e.title)}</h3>
          <div class="meta"><span>🗓 ${esc(fmtDate(e.date))}</span>${e.place ? `<span>📍 ${esc(e.place)}</span>` : ''}</div>
          <div class="chips">${priceChip(e)}${seatsChip(e)}</div></div>
      </button>`).join('');
    $('list').querySelectorAll('.ev').forEach(b => b.onclick = () => openEvent(b.dataset.id));
  } else {
    skeleton();
    let r; try { r = await api('my'); } catch (e) { r = { ok: false }; }
    if (tab !== 'my') return;
    if (!r.ok) { $('list').innerHTML = '<div class="empty glass"><div class="e">🔒</div>Открой это окно через бота в Telegram, чтобы увидеть свои заявки</div>'; return; }
    if (!r.list.length) { $('list').innerHTML = '<div class="empty glass"><div class="e">🎟</div>Ты пока никуда не записан(а)</div>'; return; }
    $('list').innerHTML = r.list.map(m => `
      <div class="ev glass" style="cursor:default">
        <div class="cover">${coverHTML(m.cover)}</div>
        <div class="b"><h3>${esc(m.title)}</h3>
          <div class="meta">${m.date ? `<span>🗓 ${esc(fmtDate(m.date))}</span>` : ''}${m.place ? `<span>📍 ${esc(m.place)}</span>` : ''}</div>
          <div class="chips">${stChip(m.status)}${m.chat ? `<a class="chip" href="${esc(m.chat)}" data-chat="1">💬 Чат</a>` : ''}</div></div>
      </div>`).join('');
    $('list').querySelectorAll('[data-chat]').forEach(a => a.onclick = ev => { ev.preventDefault(); openLink(a.getAttribute('href')); });
  }
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  if (tab === b.dataset.t) return; tab = b.dataset.t; haptic('i', 'light');
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); render();
});

function openEvent(id) {
  cur = events.find(e => e.id === id); if (!cur) return;
  haptic('i', 'light');
  $('hero').innerHTML = `
    <div class="cover">${coverHTML(cur.cover)}</div>
    <h2>${esc(cur.title)}</h2>
    <div class="chips" style="justify-content:center">${priceChip(cur)}${seatsChip(cur)}</div>
    <div class="facts">
      <div class="fact"><i>🗓</i><div>${esc(fmtDate(cur.date))}</div></div>
      ${cur.place ? `<div class="fact"><i>📍</i><div>${esc(cur.place)}</div></div>` : ''}
    </div>
    ${cur.description ? `<p class="desc">${esc(cur.description)}</p>` : ''}`;
  const paid = cur.price > 0, full = cur.left === 0;
  $('payBox').classList.toggle('hidden', !paid); $('shotBox').classList.toggle('hidden', !paid);
  if (paid) { $('payPrice').textContent = money(cur.price); $('payCard').textContent = cur.card || 'уточни у организаторов'; }
  resetShot(); $('err').textContent = '';
  document.querySelectorAll('#formBox input').forEach(i => i.classList.remove('bad'));
  $('bSend').disabled = full; $('bSend').textContent = full ? 'Мест больше нет' : 'Записаться';
  show('vEvent');
}
$('bBack').onclick = () => { show('vList'); render(); };
$('bHome').onclick = () => { tab = 'events'; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.t === 'events')); show('vList'); loadEvents(); };
$('bCopy').onclick = async () => {
  const n = ($('payCard').textContent.match(/[\d ]{12,}/) || [$('payCard').textContent])[0].replace(/\s+/g, '');
  try { await navigator.clipboard.writeText(n); toast('Номер карты скопирован'); } catch (e) { toast(n); }
  haptic('n', 'success');
};

/* ---------- скриншот ---------- */
function resetShot() { shot = null; $('fShot').value = ''; $('shotTh').innerHTML = '📎'; $('shotT').textContent = 'Прикрепить скриншот'; $('upload').classList.remove('bad'); }
$('upload').onclick = () => $('fShot').click();
$('fShot').onchange = () => {
  const f = $('fShot').files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const k = Math.min(1, 1400 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    shot = c.toDataURL('image/jpeg', .82); URL.revokeObjectURL(url);
    $('shotTh').innerHTML = `<img src="${shot}" alt="">`; $('shotT').textContent = 'Скриншот прикреплён ✓'; $('upload').classList.remove('bad');
  };
  img.onerror = () => toast('Не получилось открыть картинку');
  img.src = url;
};

/* ---------- форма ---------- */
const FIELDS = ['fName', 'fCourse', 'fPhone', 'fHemis'];
function saveForm() {
  const d = {}; FIELDS.forEach(f => d[f] = $(f).value.trim());
  try { localStorage.setItem('uwedsu_form', JSON.stringify(d)); } catch (e) {}
  try { inTg && tg.CloudStorage && tg.CloudStorage.setItem('form', JSON.stringify(d)); } catch (e) {}
}
function fillForm(d) { if (d) FIELDS.forEach(f => { if (d[f] && !$(f).value) $(f).value = d[f]; }); }
try { fillForm(JSON.parse(localStorage.getItem('uwedsu_form') || 'null')); } catch (e) {}
try { inTg && tg.CloudStorage && tg.CloudStorage.getItem('form', (e, v) => { if (!e && v) try { fillForm(JSON.parse(v)); } catch (x) {} }); } catch (e) {}
if (me && !$('fName').value) $('fName').value = [me.last_name, me.first_name].filter(Boolean).join(' ');
FIELDS.forEach(f => $(f).addEventListener('input', () => $(f).classList.remove('bad')));

function openLink(u) { if (!u) return; try { if (inTg && /^https:\/\/t\.me\//.test(u)) return tg.openTelegramLink(u); if (inTg) return tg.openLink(u); } catch (e) {} location.href = u; }

$('bSend').onclick = async () => {
  $('err').textContent = '';
  const name = $('fName').value.trim(), course = $('fCourse').value.trim(), phone = $('fPhone').value.trim(), hemis = $('fHemis').value.trim();
  const bad = [];
  if (name.length < 3) bad.push('fName');
  if (!course) bad.push('fCourse');
  if (phone.replace(/\D/g, '').length < 9) bad.push('fPhone');
  bad.forEach(f => $(f).classList.add('bad'));
  if (cur.price > 0 && !shot) { $('upload').classList.add('bad'); bad.push('shot'); }
  if (bad.length) { haptic('n', 'error'); $('err').textContent = bad.includes('shot') && bad.length === 1 ? 'Прикрепи скриншот оплаты' : 'Заполни отмеченные поля'; return; }
  saveForm();
  if (inTg && me && me.allows_write_to_pm === false && tg.requestWriteAccess) {
    await new Promise(r => { try { tg.requestWriteAccess(() => r()); } catch (e) { r(); } });
  }
  $('bSend').disabled = true; $('bSend').textContent = 'Отправляем…';
  let r;
  try { r = await api('register', { eventId: cur.id, form: { name, course, phone, hemis }, screenshot: cur.price > 0 ? shot : null }); }
  catch (e) { r = { ok: false, message: 'Нет связи. Попробуй ещё раз.' }; }
  $('bSend').disabled = false; $('bSend').textContent = 'Записаться';
  if (!r.ok) { haptic('n', 'error'); $('err').textContent = r.message || 'Что-то пошло не так'; if (r.error === 'full') { cur.left = 0; } return; }
  haptic('n', 'success');
  const ok = r.status === 'Принят';
  $('dIcon').textContent = ok ? '🎉' : '⏳';
  $('dTitle').textContent = ok ? 'Ты записан(а)!' : 'Заявка отправлена';
  $('dText').textContent = ok ? `${cur.title} · ${fmtDate(cur.date)}. Подтверждение придёт в этот чат.` : 'Мы проверим оплату и пришлём ответ в этот чат. Обычно это занимает немного времени.';
  $('bChat').classList.toggle('hidden', !r.chat); $('bChat').onclick = () => openLink(r.chat);
  show('vDone');
};

/* ---------- старт ---------- */
(async () => {
  await loadEvents();
  const sp = (inTg && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('event');
  if (sp && events.find(e => e.id === sp)) openEvent(sp);
})();
window.__app = { get events() { return events; }, api, openEvent };
</script>
